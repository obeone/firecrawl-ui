server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;

  # Security headers, inherited by every location below that sets none of
  # its own. The Content-Security-Policy value must match CSP_HEADER_POLICY
  # in src/config/csp.ts (src/config/csp.test.ts checks it); the header adds
  # frame-ancestors, which browsers ignore in the <meta> tag.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
