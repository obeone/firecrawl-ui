version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    ignore:
      # TypeScript majors are blocked by the toolchain, not by this code:
      # - 7.x ships no programmatic API until 7.1, so vue-tsc (Volar) and
      #   typescript-eslint cannot use it; the 7.0 announcement tells Vue
      #   projects to stay on 6.0 for now.
      # - 6.x is refused by openapi-typescript (peer typescript ^5.x), which
      #   `npm run api:types` needs.
      # Lift this once openapi-typescript accepts 6 (for 6.x) or once 7.1
      # ships its API and vue-tsc and typescript-eslint support it (for 7.x).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-major:
        applies-to: version-updates
        update-types:
          - major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      docker-major:
        applies-to: version-updates
        update-types:
          - major
