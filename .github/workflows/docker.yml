name: Build and push container

# Called by the CI workflow once lint, type check, tests and build have passed,
# so an image is never published from a commit that fails CI.
on:
  workflow_call:
    inputs:
      push:
        description: Push and sign the image (false only builds it, for pull requests).
        type: boolean
        default: false
      version:
        description: App version shown on the About page (computed by CI).
        type: string
        default: dev

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # For cosign
    steps:
      - uses: actions/checkout@v7
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/obeone/firecrawl-ui
            obeoneorg/firecrawl-ui
          # `latest` only follows the default branch, not release tags.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Set up QEMU
        if: inputs.push
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        # This step will fail if the secrets are not configured, but the workflow will continue
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push images
        uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: .
          # Pull requests only check that the image builds, on one platform.
          platforms: ${{ inputs.push && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
      - name: Set up cosign
        if: inputs.push
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image with cosign
        if: inputs.push
        run: |
          cosign sign --yes "ghcr.io/obeone/firecrawl-ui@${DIGEST}"
          cosign sign --yes "docker.io/obeoneorg/firecrawl-ui@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: true
          DIGEST: ${{ steps.docker_build.outputs.digest }}

      - name: Updage Docker Hub description
        if: inputs.push && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: obeoneorg/firecrawl-ui
