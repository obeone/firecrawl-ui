name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run by the Release workflow on the tag it creates: a tag pushed with
  # GITHUB_TOKEN does not trigger the push event above.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint check
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        # APP_VERSION is computed as in docker.yml, so Pages and the image
        # show the same version.
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            export APP_VERSION="sha-${GITHUB_SHA::7}"
          fi
          npm run build
      - name: Copy 404 page
        run: cp public/404.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Build the container image after CI passes. Pushes to main and version
  # tags (pushed or released) publish it; pull requests only check that it
  # builds.
  image:
    needs: node
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  deploy:
    needs: node
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
