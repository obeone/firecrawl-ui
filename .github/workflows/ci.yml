name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  node:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so git describe finds the last release.
          fetch-depth: 0
      # The version shown on the About page, for Pages and the image alike:
      # the release on a tag (v2026.11.1 -> 2026.11.1), otherwise the last
      # release plus the commits since (2026.11.1-3-gabc1234).
      - name: Compute app version
        id: version
        run: |
          version="$(git describe --tags --match 'v[0-9]*' --always)"
          echo "value=${version#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint check
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
      - name: Copy 404 page
        run: cp public/404.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Build the container image after CI passes. Pushes to main and version
  # tags publish it; pull requests only check that it builds.
  image:
    needs: node
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      push: ${{ github.event_name == 'push' }}
      version: ${{ needs.node.outputs.version }}
    secrets: inherit

  deploy:
    needs: node
    runs-on: ubuntu-latest
    # main and release tags, so Pages always carries the release number.
    if: github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
